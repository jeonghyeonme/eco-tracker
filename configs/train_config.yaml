# 🚀 YOLOv8 Training Configuration (Eco-Tracker)

# 1. Model Settings (모델 설정)
model_variant: "yolov8n"  # 모델 종류 결정 (yolov8n: 가장 빠름, yolov8s: 균형, yolov8m: 정확함/무거움)
pretrained: true          # 사전 학습된 가중치를 사용하여 학습 시작 여부 (권장: true)

# 2. Dataset Settings (데이터셋 설정)
data_yaml: "data/yolo_dataset/dataset.yaml" # 클래스 이름과 데이터 경로가 정의된 yaml 파일 위치
img_size: 640                  # 학습 시 이미지 입력 해상도 (일반적으로 640 사용)

# 3. Training Hyperparameters (학습 하이퍼파라미터)
epochs: 10                     # 전체 데이터셋을 몇 번 반복해서 학습할지 결정
batch_size: 16                 # 한 번에 처리할 이미지 묶음 크기 (가장 안전한 값)
lr0: 0.01                      # 초기 학습률 (Learning Rate). 학습의 보폭을 결정
optimizer: "auto"              # 최적화 알고리즘 (SGD, Adam, AdamW 등. auto는 모델이 자동 선택)
patience: 10                   # 성능 향상이 없을 때 조기 종료(Early Stopping)를 위한 대기 epoch 수

# 4. Hardware & Logging (하드웨어 및 로그 설정)
device: "auto"                 # 학습 장치 (auto: 자동 감지, 0: 첫 번째 GPU, cpu: CPU 강제 사용)
project: "runs"                # 결과가 저장될 상위 디렉토리 이름
name: "exp_augmented"          # 이번 실험의 이름
verbose: true                  # 학습 과정을 상세히 출력할지 여부

# 5. Data Augmentation Settings (데이터 증강 설정)
# 데이터가 부족할 때 가상의 데이터를 생성하여 과적합을 방지하고 성능을 높입니다.
hsv_h: 0.015                   # 이미지 색조(Hue) 변경 범위
hsv_s: 0.7                     # 이미지 채도(Saturation) 변경 범위
hsv_v: 0.4                     # 이미지 명도(Value) 변경 범위
degrees: 10.0                  # 이미지 회전 범위 (degrees)
translate: 0.1                 # 이미지 이동 범위 (fraction)
scale: 0.5                     # 이미지 크기 조절 범위 (gain)
shear: 2.0                     # 이미지 전단(Shear) 변형 범위 (degrees)
perspective: 0.0               # 투영 변형 범위
flipud: 0.0                    # 상하 반전 확률
fliplr: 0.5                    # 좌우 반전 확률
mosaic: 1.0                    # 4장의 이미지를 합쳐 한 장으로 만드는 Mosaic 증강 확률 (강력 권장)
mixup: 0.1                     # 두 이미지를 섞는 Mixup 증강 확률
copy_paste: 0.1                # 객체를 복사해서 다른 이미지에 붙이는 확률
